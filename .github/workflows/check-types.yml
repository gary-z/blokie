name: Check the types

# Check JSDoc types for the page, workers, tests, and tools.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the type checker
        run: npm install --no-audit --no-fund

      - name: Check the page and the engine
        run: npx tsc -p tsconfig.json

      - name: Check the workers
        run: npx tsc -p tsconfig.worker.json

      - name: Check the tests and tools
        run: npx tsc -p tsconfig.node.json
