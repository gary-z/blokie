name: Check the types

# The JavaScript is checked, not compiled. Types are JSDoc comments and nothing
# emits, so what ships is what is in the repository -- but the shapes that cross
# a boundary are checked all the same: the engine's public API, the game state
# the worker is handed, and the events the service worker really receives.
#
# Three configurations, because the page, a worker and Node have different
# globals. See the comments in tsconfig.json, tsconfig.worker.json and
# tsconfig.node.json.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The type checker and Node's type definitions. Neither has dependencies
      # of its own, so there is nothing to resolve beyond the two.
      - name: Install the type checker
        run: npm install --no-audit --no-fund

      - name: Check the page and the engine
        run: npx tsc -p tsconfig.json

      - name: Check the workers
        run: npx tsc -p tsconfig.worker.json

      - name: Check the tests and tools
        run: npx tsc -p tsconfig.node.json
