name: Check the engine

# The solver is the part of this repo with no way to eyeball whether it is
# right: a move search that quietly stops considering half the orderings still
# returns a legal move, and the only thing that notices is a score that drifts
# down over thousands of games. These run the checks that would catch it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Both compilers, because the engine leans on the optimizer and the two do not
  # accept the same source. A hint one of them has not implemented yet is a
  # warning, which -Werror turns into a build that does not happen at all -- and
  # building only with the compiler that has it is how that gets committed.
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    name: Native (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4

      - name: Configure native engine tests
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S engine/cpp -B /tmp/blokie-native-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build native engine tests
        run: cmake --build /tmp/blokie-native-tests --parallel 2 --target eval-test bitboard-test placement-test search-test probe-test fitness search-stats golden golden_verify golden_measure

      - name: Native engine tests
        run: ctest --test-dir /tmp/blokie-native-tests --output-on-failure

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe analysis tools
        run: |
          node --check engine/tools/analyze-chain-lengths.js
          node --check engine/tools/analyze-probes.js
          node --check engine/tools/compare-fitness.js
          node --check engine/tools/compare-probes.js

      - name: Bitboards, pieces and clearing
        run: node test/engine/bitboard-test.js

      - name: Placement rules
        run: node test/engine/placement-test.js

      - name: Move planning
        run: node test/engine/ai-plan-test.js

      - name: Move search against a brute force
        run: node test/engine/enumeration-test.js
