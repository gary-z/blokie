<!DOCTYPE html>
<html>

<head>
    <title>Watch an AI Play Blockudoku/Woodoku/Block Sudoku</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="web/script.js" type="module"></script>
    <style>
        @keyframes cell-fade-in {
            from { opacity: 0.45; }
        }
        @keyframes cell-shrink-out {
            to { transform: scale(0); }
        }
        td.has-piece,
        td.drag-shadow {
            animation: cell-fade-in 0.2s ease-out;
        }
        #game-board tr:nth-of-type(n):nth-of-type(n) td.shrinking-piece:nth-of-type(n):nth-of-type(n) {
            background: rgb(54, 112, 232);
            border: 1px solid black;
            animation: cell-shrink-out 0.2s ease-in forwards;
        }
        body {
            padding: none;
            border: none;
        }

        /* The settings gear is fixed in the top right corner, which is the same
           line the score is drawn on. Both are sized off these, so the score
           can keep exactly the gear's width clear of that corner. */
        :root {
            --gear-icon: min(4.5vw, 3vh);
            --gear-pad: min(2vw, 1.33vh);
        }

        #page-description {
            text-align: center;
        }

        #score {
            text-align: center;
            font-family: roboto;
            font-size: 5vh;
            font-weight: bold;
            margin-bottom: 2vh;
            /* Reserved on both sides so the score stays centred. A long
               "Final score:" wraps rather than running under the gear. */
            padding: 0 calc(var(--gear-icon) + 3 * var(--gear-pad));
        }

        #for-aspect-ratio {
            aspect-ratio: 2/3;
            width: min(90vw, calc(90vh / (3/2)));
            margin: auto;
        }

        #game-table-container {
            aspect-ratio: 1 / 1;
        }

        #game-board {
            border-collapse: collapse;
            background: white;
            outline: 4px solid rgb(180, 185, 190);
            margin: auto;
            width: 100%;
            height: 100%;
        }

        #game-board tr td {
            width: 10%;
            height: 10%;
            border: 1px solid rgb(180, 185, 190);
        }

        #game-board tr:nth-of-type(-n+3) td:nth-child(n+4):nth-child(-n+6),
        #game-board tr:nth-child(n+4):nth-child(-n+6) td:nth-child(-n+3),
        #game-board tr:nth-child(n+4):nth-child(-n+6) td:nth-child(n+7):nth-child(-n+9),
        #game-board tr:nth-child(n+7):nth-child(-n+9) td:nth-child(n+4):nth-child(-n+6) {
            background: rgb(228, 233, 238)
        }

        #game-board tr:nth-of-type(n):nth-of-type(n) td.has-piece:nth-of-type(n):nth-of-type(n) {
            background: rgb(54, 112, 232);
            border: 2px solid black;
        }

        #game-board tr:nth-of-type(n):nth-of-type(n) td.drag-shadow:nth-of-type(n):nth-of-type(n) {
            background: rgba(128, 128, 128, 0.45);
        }

        @media(hover: hover) and (pointer: fine) {
            table.pieces-on-deck tr td.has-piece {
                cursor: grab;
            }
        }

        #pieces-on-deck-container {
            display: flex;
            margin-left: auto;
            margin-right: auto;
            border-collapse: collapse;
            aspect-ratio: 3 / 1;
            width: 100%;
        }

        table.pieces-on-deck {
            border-collapse: collapse;
            border-spacing: 0;
            margin: 3px;
        }

        table.pieces-on-deck td,
        table.pieces-on-deck th {
            padding: 0;
        }

        table.pieces-on-deck {
            width: 33%
        }

        table.pieces-on-deck tr td {
            width: 20%;
            height: 20%;
        }

        table.pieces-on-deck tr td.has-piece {
            background: rgb(54, 112, 232);
            border: 1px solid black;
        }

        /* Sparkles is a colour emoji, drawn gold everywhere, and gold washes out
           on the tint the picker wears while the assist is playing. This is the
           same glyph from Noto Emoji -- the monochrome family -- subset to that
           one codepoint and inlined so it costs no request. Being an outline
           font it takes the element's own colour, so it tracks both states.
           unicode-range keeps it off everything else, the gamepad on Manual
           included, and if it ever fails to load the colour emoji is still
           underneath it.
           Noto Emoji, SIL Open Font License 1.1:
           https://github.com/googlefonts/noto-emoji */

            font-family: 'sparkle';
            font-style: normal;
            font-weight: 700;

            unicode-range: U+2728;
        }

        #assist-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
            min-height: 4vh;
        }

        #ai-assist {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #444;
            /* A board cell is min(10vw, 6.67vh); size off the same min() so the
               control stays about a block tall whichever axis is binding. */
            padding: min(2vw, 1.33vh) min(3vw, 2vh);
            cursor: pointer;
            font-family: 'sparkle', roboto;
            font-size: min(4.5vw, 3vh);
            font-weight: bold;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        /* Native popups ignore this on some platforms; harmless where they do. */
        #ai-assist option {
            font-weight: bold;
        }

        /* Tinted while the assist is playing, plain while you are. */
        #ai-assist.assist-on {
            background: #e8eefc;
            border-color: rgb(54, 112, 232);
            color: #222;
        }

        /* Sound and the Github link are settings, not part of playing, so they
           sit behind the gear in the corner rather than under the board. The
           gear is fixed to the viewport: the board is sized off the smaller of
           the two axes and rarely fills the page, so anchoring to it would
           leave the gear floating somewhere in the middle on wide screens. */
        #settings {
            position: fixed;
            top: var(--gear-pad);
            right: var(--gear-pad);
            font-family: roboto;
            /* Above the page, below the piece being dragged. */
            z-index: 10;
        }

        /* Square, and built like the picker in the bottom bar. */
        #settings-button {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #444;
            cursor: pointer;
            font-size: var(--gear-icon);
            line-height: 1;
            padding: var(--gear-pad);
            transition: background 0.15s, border-color 0.15s;
        }

        #settings-button[aria-expanded="true"] {
            background: #e8eefc;
            border-color: rgb(54, 112, 232);
        }

        #settings-menu {
            position: absolute;
            top: calc(100% + var(--gear-pad) / 2);
            /* Hangs off the gear's right edge, so it opens onto the page
               instead of off the side of it. */
            right: 0;
            display: flex;
            flex-direction: column;
            gap: calc(var(--gear-pad) / 4);
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            padding: calc(var(--gear-pad) / 2);
        }

        /* display: flex above would otherwise show the menu while it is shut. */
        #settings-menu[hidden] {
            display: none;
        }

        #settings-menu button,
        #settings-menu a {
            display: flex;
            align-items: center;
            gap: var(--gear-pad);
            background: none;
            border: none;
            border-radius: 4px;
            color: #444;
            cursor: pointer;
            font-family: inherit;
            font-size: min(3.5vw, 2.33vh);
            padding: calc(var(--gear-pad) * 0.75) var(--gear-pad);
            text-align: left;
            text-decoration: none;
            white-space: nowrap;
        }

        /* A column of its own, so the labels line up whatever the icons are. */
        #settings-menu .menu-icon {
            width: var(--gear-icon);
            text-align: center;
        }

        /* The tint the picker wears while the assist plays, for the same
           reason: it marks the setting that is currently on. */
        #sound.sound-on {
            background: #e8eefc;
            color: #222;
        }

        /* Hover left on a touch screen sticks to whatever was tapped last. */
        @media(hover: hover) and (pointer: fine) {
            #settings-menu button:hover,
            #settings-menu a:hover {
                background: #f0f0f0;
            }

            #sound.sound-on:hover {
                background: #dbe5fa;
            }
        }
